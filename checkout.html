<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>إتمام الطلب والدفع | ZEUS STORE</title>
    <link rel="icon" href="assets/logo-ar.webp" type="image/webp">
    <link rel="stylesheet" href="assets/0062d8248a8725a2.css">
    <link rel="stylesheet" href="assets/4c413b90ebb1cb6f.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --bg-dark: #0b0f19;
            --bg-card: #111827;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(245, 158, 11, 0.35);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.06) 0%, transparent 50%), var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
        }
        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
        }
        .brand img { width: 34px; height: 34px; border-radius: 8px; }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover { color: var(--primary); }
        .checkout-layout {
            max-width: 1100px;
            margin: 36px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 28px;
            flex: 1;
            box-sizing: border-box;
            width: 100%;
        }
        @media (max-width: 860px) {
            .checkout-layout { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 14px;
        }
        .card-header i { color: var(--primary); font-size: 18px; }
        .card-header h3 { margin: 0; font-size: 17px; font-weight: 700; }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }
        .form-group input, .form-group select {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
        }
        .payment-methods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }
        .payment-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .payment-option:hover, .payment-option.selected {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--primary);
        }
        .payment-option img {
            height: 24px;
            margin-bottom: 8px;
            object-fit: contain;
        }
        .payment-option span {
            display: block;
            font-size: 12px;
            font-weight: 600;
        }
        /* Summary Card */
        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 24px;
            height: fit-content;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .summary-item img {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
        }
        .summary-item-details { flex: 1; }
        .summary-item-details h4 { margin: 0 0 4px; font-size: 14px; }
        .summary-item-details span { color: #fbbf24; font-size: 13px; font-weight: 700; }
        .calc-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--text-muted);
        }
        .calc-row.total {
            border-top: 1px solid var(--border-subtle);
            padding-top: 14px;
            margin-top: 14px;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }
        .calc-row.total span:last-child {
            color: #fbbf24;
        }
        .btn-submit-order {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .btn-submit-order:hover { opacity: 0.95; }
        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <img src="assets/logo-ar.webp" alt="ZEUS STORE">
                <span>ZEUS STORE</span>
            </a>
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-right"></i>
                <span>العودة للمتجر</span>
            </a>
        </div>
    </header>

    <div class="checkout-layout">
        <!-- Steps Form -->
        <div>
            <!-- Step 1: Customer details -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-user-check"></i>
                    <h3>1. بيانات العميل والتسليم</h3>
                </div>
                <div class="form-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" id="custName" placeholder="مثال: محمد علي" required>
                </div>
                <div class="form-group">
                    <label>رقم الواتساب (لاستلام كود التفعيل فوراً)</label>
                    <input type="tel" id="custPhone" placeholder="مثال: +966 50 123 4567" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني (اختياري)</label>
                    <input type="email" id="custEmail" placeholder="name@example.com">
                </div>
            </div>

            <!-- Step 2: Payment method -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-wallet"></i>
                    <h3>2. طريقة الدفع المعتمدة</h3>
                </div>
                <div class="payment-methods-grid">
                    <div class="payment-option selected" onclick="selectPayment('mada', this)">
                        <img src="assets/mada.png" alt="Mada">
                        <span>مدى Mada</span>
                    </div>
                    <div class="payment-option" onclick="selectPayment('apple_pay', this)">
                        <img src="assets/apple_pay.png" alt="Apple Pay">
                        <span>أبل باي Apple Pay</span>
                    </div>
                    <div class="payment-option" onclick="selectPayment('cards', this)">
                        <img src="assets/visa.png" alt="Cards">
                        <span>فيزا / ماستركارد</span>
                    </div>
                    <div class="payment-option" onclick="selectPayment('instapay', this)">
                        <img src="assets/instapay.png" alt="InstaPay">
                        <span>إنستاباي InstaPay</span>
                    </div>
                    <div class="payment-option" onclick="selectPayment('usdt', this)">
                        <img src="assets/usdt.svg" alt="USDT">
                        <span>العملات الرقمية USDT</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Order Summary -->
        <div>
            <div class="summary-card">
                <div class="card-header">
                    <i class="fa-solid fa-receipt"></i>
                    <h3>ملخص الطلب</h3>
                </div>
                <div id="orderItemsList">
                    <!-- Loaded dynamically -->
                </div>

                <div class="calc-row">
                    <span>المجموع الفرعي:</span>
                    <span id="summarySubtotal">0 SAR</span>
                </div>
                <div class="calc-row">
                    <span>رسوم التسليم الرقمي:</span>
                    <span style="color: #10b981;">مجاناً (فوري)</span>
                </div>
                <div class="calc-row total">
                    <span>المجموع الكلي:</span>
                    <span id="summaryGrandTotal">0 SAR</span>
                </div>

                <button class="btn-submit-order" onclick="submitOrder()">
                    <i class="fa-solid fa-lock"></i>
                    <span>إتمام الدفع وتأكيد الطلب ⚡️</span>
                </button>

                <div class="secure-badge">
                    <i class="fa-solid fa-shield-check" style="color: #10b981;"></i>
                    <span>عملية دفع مشفرة وآمنة 100% بنظام الحماية SSL</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedMethod = 'mada';
        let orderItems = [];

        function selectPayment(method, el) {
            selectedMethod = method;
            document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }

        async function initCheckout() {
            const urlParams = new URLSearchParams(window.location.search);
            const directItemId = urlParams.get('item');

            if (directItemId) {
                try {
                    const res = await fetch('catalog.json');
                    const catalog = await res.json();
                    const item = catalog.find(p => p.id === directItemId);
                    if (item) {
                        orderItems = [{ ...item, quantity: 1 }];
                    }
                } catch(e) {}
            }

            if (!orderItems.length) {
                const stored = localStorage.getItem('zeus_cart');
                if (stored) {
                    orderItems = JSON.parse(stored);
                }
            }

            // Fallback product if nothing selected
            if (!orderItems.length) {
                orderItems = [{
                    id: 'zeus-codm-60',
                    title: 'اشتراك كود موبايل 60 يوم (ايفون و أيباد)',
                    price_sar: 299.0,
                    image: 'assets/6a309dcb657f2_1781571019.webp',
                    quantity: 1
                }];
            }

            renderSummary();
        }

        function renderSummary() {
            const list = document.getElementById('orderItemsList');
            let total = 0;

            list.innerHTML = orderItems.map(item => {
                const price = item.price_sar || 299;
                const sub = price * item.quantity;
                total += sub;
                return `
                    <div class="summary-item">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="summary-item-details">
                            <h4>${item.title}</h4>
                            <span>${item.quantity} × ${price.toLocaleString()} ر.س</span>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('summarySubtotal').textContent = `${total.toLocaleString()} ر.س`;
            document.getElementById('summaryGrandTotal').textContent = `${total.toLocaleString()} ر.س`;
        }

        async function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();

            if (!name || !phone) {
                alert('يرجى كتابة الاسم ورقم الواتساب لاستلام الكود.');
                return;
            }

            const orderPayload = {
                customer_name: name,
                customer_phone: phone,
                customer_email: document.getElementById('custEmail').value.trim(),
                payment_method: selectedMethod,
                items: orderItems,
                timestamp: new Date().toISOString()
            };

            // Try backend API first
            try {
                const res = await fetch('/api/v1/order/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });
                if (res.ok) {
                    const data = await res.json();
                    alert(`تم تأكيد طلبك بنجاح! رقم الطلب: ${data.order_id || 'ZEUS-' + Math.floor(Math.random()*90000)}`);
                    localStorage.removeItem('zeus_cart');
                    window.location.href = 'index.html';
                    return;
                }
            } catch (err) {
                // Static GitHub Pages fallback
            }

            const orderId = 'ZEUS-' + Math.floor(100000 + Math.random() * 900000);
            alert(`تم تسجيل طلبك بنجاح!
رقم الطلب: ${orderId}
سيتم إرسال كود التفعيل إلى رقمك عبر الواتساب فوراً.`);
            localStorage.removeItem('zeus_cart');
            window.location.href = 'index.html';
        }

        window.onload = initCheckout;
    </script>
</body>
</html>
